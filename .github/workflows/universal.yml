name: universal

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build + Profile U contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned to match .github/workflows/ci.yml: the goffi_musl build below
          # depends on the toolchain's cgo_import_dynamic restrictions, which
          # the -gcflags=...=-std workaround is calibrated against.
          go-version: '1.26.x'
      - name: Build every mode, vet and unit tests
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go build -tags goffi_universal ./...
          CGO_ENABLED=0 go build -tags goffi_static ./...
          CGO_ENABLED=0 go build -tags goffi_musl -gcflags=github.com/go-webgpu/goffi/internal/dl=-std ./...
          # -unsafeptr=false: goffi reconstructs pointers from native call
          # registers and stack slots by design (see ffi/callback_pointer.go's
          # //go:nocheckptr contract). ci.yml runs vet through golangci-lint,
          # which excludes govet on exactly those paths (.golangci.yml); this
          # flag is the bare-vet equivalent of that exclusion.
          CGO_ENABLED=0 go vet -unsafeptr=false ./...
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=0 go test -tags goffi_universal ./internal/...
      - name: Build the universal probe and check the ELF contract
        run: |
          set -euo pipefail
          bash scripts/build-universal.sh -o universal-probe ./cmd/universal-probe
          go run ./cmd/goffi-audit universal-probe
          bash scripts/build-universal.sh -o universal-respawn ./cmd/universal-respawn
          go run ./cmd/goffi-audit universal-respawn
      - name: A universal binary starts copies of itself (runner host)
        run: |
          set -euo pipefail
          ./universal-respawn | tee out.txt
          grep -q RESPAWN-PROBE-OK out.txt
      - name: Upload universal probe
        uses: actions/upload-artifact@v4
        with:
          name: universal-probe
          path: |
            universal-probe
            universal-respawn

  run-glibc:
    name: run on glibc (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # bullseye and 20.04 carry glibc 2.31, which still keeps the pthread_*
        # and dl* functions in libpthread.so.0 and libdl.so.2 rather than in
        # libc.so.6 (merged in 2.34): the images above cannot catch a bridge
        # that preloads libc alone (f4 #1381).
        image: [ "debian:stable-slim", "ubuntu:24.04", "debian:bullseye-slim", "ubuntu:20.04" ]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: universal-probe
      - name: Run the same universal binary on glibc
        run: |
          set -eu
          chmod +x universal-probe
          ./universal-probe | tee out.txt
          grep -q UNIVERSAL-PROBE-OK out.txt
      - name: The same binary starts copies of itself
        run: |
          set -eu
          chmod +x universal-respawn
          ./universal-respawn | tee out.txt
          grep -q RESPAWN-PROBE-OK out.txt

  preload-failure:
    name: a preloaded library that aborts (f4 #1213)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build a universal binary that reports whether FFI is available
        run: |
          set -euo pipefail
          bash scripts/build-universal.sh -o universal-available ./cmd/universal-available
      - name: Build a preloadable library that aborts only in the re-executed process
        run: |
          set -euo pipefail
          # ESET's libesets_pac.so, preloaded into every process through
          # /etc/ld.so.preload, aborts in its constructor when the universal
          # binary is re-executed through the host loader (f4 #1213). This
          # library does the same for exactly that launch -- a loader started
          # with --preload and an image named /proc/self/fd/N -- and leaves
          # every other process alone.
          cat > abort.c <<'C'
          #include <fcntl.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          __attribute__((constructor)) static void init(void) {
              char buf[4096];
              int fd = open("/proc/self/cmdline", O_RDONLY);
              if (fd < 0) return;
              ssize_t n = read(fd, buf, sizeof buf - 1);
              close(fd);
              if (n <= 0) return;
              for (ssize_t i = 0; i < n; i++) if (buf[i] == 0) buf[i] = ' ';
              buf[n] = 0;
              if (strstr(buf, "--preload") && strstr(buf, " /proc/self/fd/")) abort();
          }
          C
          echo 'static int unused;' > noop.c
          sudo gcc -shared -fPIC -o /usr/local/lib/libabort.so abort.c
          sudo gcc -shared -fPIC -o /usr/local/lib/libnoop.so noop.c
      - name: Nothing preloaded, the bridge is unchanged
        run: |
          set -eu
          ./universal-available | tee out.txt
          grep -q 'ffi.Available = true' out.txt
          grep -q 'workload = ok' out.txt
      - name: A harmless LD_PRELOAD still gets FFI
        run: |
          set -eu
          LD_PRELOAD=/usr/local/lib/libnoop.so ./universal-available | tee out.txt
          grep -q 'ffi.Available = true' out.txt
          grep -q 'workload = ok' out.txt
      - name: An aborting LD_PRELOAD library falls back to no FFI
        run: |
          set -eu
          LD_PRELOAD=/usr/local/lib/libabort.so ./universal-available 2>err.txt | tee out.txt
          cat err.txt
          grep -q 'ffi.Available = false' out.txt
          grep -q 'workload = ok' out.txt
          grep -q 'continuing without FFI' err.txt
      - name: An aborting /etc/ld.so.preload library falls back to no FFI
        run: |
          set -eu
          echo /usr/local/lib/libabort.so | sudo tee /etc/ld.so.preload
          trap 'sudo rm -f /etc/ld.so.preload' EXIT
          ./universal-available 2>err.txt | tee out.txt
          cat err.txt
          grep -q 'ffi.Available = false' out.txt
          grep -q 'workload = ok' out.txt
          grep -q 'continuing without FFI' err.txt

  run-musl:
    name: run on musl (alpine)
    needs: build
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: universal-probe
      - name: Run the same universal binary on musl
        shell: sh
        run: |
          set -eu
          chmod +x universal-probe
          ./universal-probe | tee out.txt
          grep -q UNIVERSAL-PROBE-OK out.txt
      - name: The same binary starts copies of itself
        shell: sh
        run: |
          set -eu
          chmod +x universal-respawn
          ./universal-respawn | tee out.txt
          grep -q RESPAWN-PROBE-OK out.txt
