name: CI

# Testing strategy:
# - Tests run natively on Linux, Windows and macOS, each on amd64 and arm64,
#   with CGO_ENABLED=0 (fakecgo) and CGO_ENABLED=1, on Go 1.25 (go.mod
#   minimum) and Go stable; Go tip runs as an informational job
# - Other targets are cross-compiled and linted via GOOS/GOARCH (Android in
#   its informational android-cross job)
# - Go 1.25+ required (matches go.mod requirement)
#
# Branch strategy (GitHub Flow): short-lived branches, pull requests into
# main; main is protected and must pass "CI Success".

on:
  push:
    branches:
      - main
      - 'experiment/**'  # goffi uses experiment/** for prototypes
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
  # Weekly run: toolchain changes (Go stable and tip) can break goffi without
  # any commit here.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  # Linting - Fast fail on code quality issues
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0  # goffi uses fakecgo with build tag !cgo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --config=.golangci.yml --timeout=5m

  # Lint every other supported target. goffi is pure Go, so with
  # CGO_ENABLED=0 GOOS/GOARCH select exactly the files a build for that
  # target compiles; linux/amd64 with CGO_ENABLED=1 covers the cgo-only
  # files. A typecheck error makes golangci-lint exit non-zero, so a target
  # that does not compile cannot pass as "0 issues". Android is linted in the
  # informational android-cross job.
  lint-targets:
    name: Lint - ${{ matrix.goos }}/${{ matrix.goarch }} (cgo=${{ matrix.cgo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, cgo: '1' }
          - { goos: linux, goarch: arm64, cgo: '0' }
          - { goos: darwin, goarch: amd64, cgo: '0' }
          - { goos: darwin, goarch: arm64, cgo: '0' }
          - { goos: windows, goarch: amd64, cgo: '0' }
          - { goos: windows, goarch: arm64, cgo: '0' }
          - { goos: freebsd, goarch: amd64, cgo: '0' }
          - { goos: freebsd, goarch: arm64, cgo: '0' }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          # FreeBSD needs fakecgo compiled as std for //go:cgo_export_dynamic.
          GOFLAGS: ${{ matrix.goos == 'freebsd' && '-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std' || '' }}
        with:
          version: latest
          args: --config=.golangci.yml --timeout=5m

  # Code formatting check
  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0  # goffi is zero-CGO library
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "ERROR: The following files are not formatted:"
            gofmt -l .
            echo ""
            echo "Run 'go fmt ./...' to fix formatting issues."
            exit 1
          fi
          echo "All files are properly formatted ✓"

  # Cross-compilation - Verify all 8 supported desktop platforms compile
  cross-compile:
    name: Cross-Compile
    runs-on: ubuntu-latest
    needs: [lint, formatting]
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Cross-compile all platforms
        run: |
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          FAILED=0
          for target in "${targets[@]}"; do
            os="${target%%/*}"
            arch="${target##*/}"
            echo "Building ${os}/${arch}..."
            if GOOS=$os GOARCH=$arch go build ./... 2>&1; then
              echo "  ✅ ${os}/${arch}"
            else
              echo "  ❌ ${os}/${arch} FAILED"
              FAILED=1
            fi
          done

          # FreeBSD requires -gcflags="-std" for fakecgo's //go:cgo_export_dynamic
          for fbsd_arch in amd64 arm64; do
            echo "Building freebsd/${fbsd_arch} (with -gcflags for fakecgo)..."
            if GOOS=freebsd GOARCH=${fbsd_arch} go build \
              -gcflags="github.com/go-webgpu/goffi/internal/fakecgo=-std" \
              ./... 2>&1; then
              echo "  ✅ freebsd/${fbsd_arch}"
            else
              echo "  ❌ freebsd/${fbsd_arch} FAILED"
              FAILED=1
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "❌ Cross-compilation check FAILED"
            exit 1
          fi
          echo "✅ All 8 platforms compile successfully"

          # Verify examples compile
          echo ""
          echo "Building examples..."
          for example_dir in examples/*/; do
            if [ -f "${example_dir}go.mod" ]; then
              example_name=$(basename "$example_dir")
              echo "Building example: ${example_name}..."
              if (cd "$example_dir" && go build . 2>&1); then
                echo "  ✅ ${example_name}"
              else
                echo "  ❌ ${example_name} FAILED"
                FAILED=1
              fi
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "❌ Examples build check FAILED"
            exit 1
          fi
          echo "✅ All examples compile successfully"

      # Regression checks for targets without a hosted runner:
      # - every test package must compile and link for FreeBSD (-exec=/bin/true
      #   builds the test binaries without running them).
      # - FreeBSD binaries must depend on libthr.so.3, not libpthread.so, which
      #   is only a development symlink (ships with FreeBSD-clibs-dev).
      # - internal/fakecgo asserts the NetBSD stack_t/mutex/cond layouts at
      #   compile time, so vetting its tests for netbsd catches a drift.
      - name: FreeBSD test build and DT_NEEDED, NetBSD fakecgo layouts
        run: |
          for arch in amd64 arm64; do
            GOOS=freebsd GOARCH=$arch go test -exec=/bin/true -count=1 \
              -gcflags="github.com/go-webgpu/goffi/internal/fakecgo=-std" ./...
            bin="$RUNNER_TEMP/ffi-freebsd-$arch.test"
            GOOS=freebsd GOARCH=$arch go test -c -o "$bin" \
              -gcflags="github.com/go-webgpu/goffi/internal/fakecgo=-std" ./ffi
            needed=$(readelf -d "$bin" | grep NEEDED)
            echo "freebsd/$arch:"
            echo "$needed"
            if ! echo "$needed" | grep -q '\[libthr\.so\.3\]'; then
              echo "❌ freebsd/$arch: libthr.so.3 missing from DT_NEEDED"
              exit 1
            fi
            if echo "$needed" | grep -q '\[libpthread\.so\]'; then
              echo "❌ freebsd/$arch: depends on libpthread.so"
              exit 1
            fi
            GOOS=netbsd GOARCH=$arch go vet ./internal/fakecgo
            echo "✅ netbsd/$arch fakecgo layouts"
          done

      # Targets whose NewCallback uses goffi's own assembly trampolines must
      # link ffi.callbackTrampoline as code. A .s file with a narrower build
      # constraint than its .go file still compiles and links, so only the
      # symbol type of a linked binary shows the breakage.
      - name: Check callback trampolines link as code
        run: scripts/check-callback-trampolines.sh

  # Android arm64/API 29+ source, ABI, cgo-mode, and ELF regression checks.
  # Keep both supported Go patch lines: runtime/cgo startup and TLS details
  # are part of this platform contract, so a single floating toolchain is not
  # sufficient evidence.
  #
  # Informational, not a merge gate: Android is a preview platform (README,
  # docs/ANDROID.md), not production code. A failure here is visible on the PR
  # but does not block CI Success and is not a required check. Do not add
  # continue-on-error: that would paint a broken Android build green. Put the
  # job back into ci-success.needs (and branch protection) once Android leaves
  # preview, i.e. after the physical-device startup validation that
  # docs/ANDROID.md requires.
  android-cross:
    name: Android arm64 (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    needs: [lint, formatting]
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.12', '1.26.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # setup-android installs `tools platform-tools` by default. Google's SDK
      # repository no longer lists the obsolete `tools` package, so
      # `sdkmanager tools` exits 1 and fails the step
      # (android-actions/setup-android#537). Nothing here uses `tools`; request
      # only platform-tools. The NDK is installed explicitly below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK r29
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Check Android arm64
        run: scripts/check-android-arm64.sh

      - name: Lint android/arm64
        if: matrix.go == '1.26.5'
        uses: golangci/golangci-lint-action@v8
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '0'
        with:
          version: latest
          args: --config=.golangci.yml --timeout=5m

  # Unit tests on every production target with a hosted runner, with the
  # minimum Go version from go.mod.
  # Tested under both CGO_ENABLED=0 (fakecgo path) and CGO_ENABLED=1 (real
  # runtime/cgo path). Both modes must pass identically; CGO_ENABLED=0 is the
  # primary path used by the gogpu ecosystem and must not regress.
  test:
    name: Test - ${{ matrix.os }} (cgo=${{ matrix.cgo }})
    runs-on: ${{ matrix.os }}
    needs: [lint, formatting]
    permissions:
      contents: read
      id-token: write  # Required for Codecov OIDC tokenless upload
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      # The C-backed end-to-end tests (ffi/testdata/structtest.c: struct,
      # variadic and callback float ABI) build their library with the runner's
      # C compiler. Require one for the runner's own architecture wherever it
      # exists, so losing it fails the job instead of turning those tests into
      # skips. windows-11-arm only has an x86-64 MinGW gcc, which cannot build
      # a DLL an arm64 process can load; there the tests skip and say why.
      GOFFI_REQUIRE_TESTLIB: ${{ matrix.os != 'windows-11-arm' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Every production target with a GitHub-hosted runner runs natively:
        # linux, windows and darwin, each on amd64 and arm64.
        # macos-latest is Apple Silicon; macos-15-intel is darwin/amd64.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        cgo: ['0', '1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # Note: go vet is included in golangci-lint job (with proper exclusions)
      # Running it separately would fail on assembly code and unsafe.Pointer usage

      - name: Run unit tests
        shell: bash
        run: |
          # Note: Race detector requires CGO_ENABLED=1, so we run it separately
          # Go automatically selects platform-specific files via build tags
          # Test only main packages to avoid coverage dilution from platform-specific files
          go test -v -coverprofile=coverage.txt -covermode=atomic ./ffi ./types

      # The internal packages have their own tests (internal/fakecgo,
      # internal/arch/amd64, internal/arch/arm64 on the arm64 macOS runner)
      # that the coverage step above deliberately leaves out. Run
      # them separately, without coverage, so they still gate every OS and cgo
      # mode: TestSighowMatchesSystemHeaders in internal/fakecgo only means
      # something when it runs against the real <signal.h> of each OS.
      - name: Run internal package tests
        shell: bash
        run: go test -count=1 -v ./internal/...

      # As a normal user TestSetuidEtc can only check that syscall.Set*id
      # fails with EPERM instead of panicking. As root it checks that every
      # thread of the process got the new credentials (glibc setxid
      # broadcast). Build as the runner user, run only the binary under sudo
      # so root never writes into the Go build/module caches.
      - name: Run fakecgo set*id tests as root (Linux, CGO_ENABLED=0)
        if: runner.os == 'Linux' && matrix.cgo == '0'
        run: |
          go test -c -o "$RUNNER_TEMP/fakecgo.test" ./internal/fakecgo
          sudo "$RUNNER_TEMP/fakecgo.test" -test.count=1 -test.v -test.run 'TestAllThreadsSyscall|TestSetuidEtc|TestThreadEntryReturn'

      - name: Display coverage summary
        shell: bash
        run: |
          echo "Coverage summary for ${{ matrix.os }}:"
          go tool cover -func=coverage.txt | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-cgo${{ matrix.cgo }}
          path: coverage.txt
          retention-days: 7

      - name: Upload coverage to Codecov (Linux, CGO_ENABLED=0)
        if: matrix.os == 'ubuntu-latest' && matrix.cgo == '0'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          slug: go-webgpu/goffi
          files: ./coverage.txt
          flags: unittests
          name: codecov-goffi
          fail_ci_if_error: false
          verbose: true

  # NOTE: Race detection requires CGO_ENABLED=1
  # The CGO_ENABLED=1 matrix entry above already exercises the real
  # runtime/cgo path, which is what allows the race detector to be used.
  # Race-detector-enabled CI can be added on top of that matrix entry without
  # any source changes if/when desired. fakecgo (CGO_ENABLED=0) is gated
  # by `//go:build !cgo` and therefore not compiled in cgo mode.

  # Benchmarks - Performance validation (Linux only - reference platform)
  # The test job pins Go 1.25, the minimum in go.mod. fakecgo and the
  # assembly depend on runtime and compiler internals that change between
  # releases, so the suite also runs on the current stable Go.
  test-go-stable:
    name: Test - Go stable - ${{ matrix.os }} (cgo=${{ matrix.cgo }})
    runs-on: ${{ matrix.os }}
    needs: [lint, formatting]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOFFI_REQUIRE_TESTLIB: ${{ matrix.os != 'windows-11-arm' && '1' || '' }} # see the test job
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        cgo: ['0', '1']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        shell: bash
        run: |
          go version
          go test -count=1 ./...

  # FreeBSD has no GitHub-hosted runner, so it runs in a VM. The cross-compile
  # job proves FreeBSD builds; this job runs the tests there: the call path,
  # callbacks and internal/fakecgo against FreeBSD's libc, libthr and kernel,
  # and the C-backed end-to-end tests with the base system compiler.
  test-freebsd:
    name: Test - FreeBSD ${{ matrix.release }} - Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    needs: [lint, formatting]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ['15.1', '14.5']
        go: ['1.25', 'stable']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same meaning as setup-go's go-version in the other jobs: the newest
      # 1.25.x patch release, or the newest stable release.
      - name: Resolve Go version
        id: go
        shell: bash
        run: |
          if [ '${{ matrix.go }}' = stable ]; then
            v=$(curl -fsSL 'https://go.dev/dl/?mode=json' | jq -r '[.[] | select(.stable)][0].version')
          else
            v=$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' | jq -r --arg p 'go${{ matrix.go }}.' \
              '[.[] | select(.stable and (.version | startswith($p)))]
               | sort_by(.version | ltrimstr($p) | tonumber) | last | .version')
          fi
          if [ -z "$v" ] || [ "$v" = null ]; then
            echo "no Go release found for ${{ matrix.go }}"
            exit 1
          fi
          echo "Go: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test in FreeBSD ${{ matrix.release }}
        uses: vmactions/freebsd-vm@v1.5.9
        env:
          GO_VERSION: ${{ steps.go.outputs.version }}
        with:
          release: ${{ matrix.release }}
          envs: GO_VERSION
          prepare: |
            fetch -o /tmp/go.tar.gz "https://go.dev/dl/${GO_VERSION}.freebsd-amd64.tar.gz"
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tar.gz
          run: sh scripts/test-freebsd-vm.sh

  # Go tip, informational (not part of CI Success: tip can break for reasons
  # outside goffi). It shows compiler and runtime changes before a release
  # ships them, e.g. the amd64 LEAVE epilogue that made fakecgo's threadentry
  # crash on Go 1.28 development builds in July 2026.
  test-go-tip:
    name: Test - Go tip - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [lint, formatting]
    env:
      GOFFI_REQUIRE_TESTLIB: '1' # see the test job
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go (bootstrap)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Go tip
        run: |
          go install golang.org/dl/gotip@latest
          gotip download
          echo "$(gotip env GOROOT)/bin" >> "$GITHUB_PATH"

      - name: Run tests (CGO_ENABLED=0 and 1)
        run: |
          go version
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=1 go test -count=1 ./...

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [lint, formatting]
    env:
      CGO_ENABLED: 0  # goffi is zero-CGO library
      GOOS: linux
      GOARCH: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run benchmarks
        run: |
          echo "Running FFI overhead benchmarks..."
          go test -bench=BenchmarkGoffi -benchmem -run=^$ ./ffi | tee bench.txt

      - name: Validate performance regression
        run: |
          # Check FFI overhead is < 200ns (acceptable threshold)
          overhead=$(grep "BenchmarkGoffiOverhead" bench.txt | awk '{print $3}' | sed 's/ns\/op//')
          echo "FFI Overhead: ${overhead}ns/op"

          if (( $(echo "$overhead > 200" | bc -l) )); then
            echo "::warning::FFI overhead ($overhead ns/op) exceeds 200ns threshold"
          else
            echo "✅ FFI overhead within acceptable range"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.txt
          retention-days: 30

  # Quality gate - Coverage threshold enforcement
  quality-gate:
    name: Quality Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports

      - name: Check coverage thresholds
        shell: bash
        run: |
          MIN_COVERAGE=70  # goffi maintains 89.1%, threshold set lower for safety
          FAILED=0

          echo "Checking coverage thresholds (minimum: ${MIN_COVERAGE}%)..."
          echo "Note: ARM64 platforms are cross-compile verified, coverage informational only"
          echo ""

          for report in coverage-reports/coverage-*/coverage.txt; do
            if [ ! -f "$report" ]; then
              continue
            fi

            # Extract job label (e.g. "ubuntu-latest-cgo0") and OS from path
            label=$(echo "$report" | sed -E 's/.*coverage-([^/]+).*/\1/')
            os=$(echo "$label" | sed -E 's/-cgo[01]$//')

            # Calculate coverage percentage
            total_line=$(go tool cover -func "$report" | grep total)
            cov=$(echo "$total_line" | awk '{print $3}' | sed 's/%//')

            # ARM64 (macos-latest) is cross-compile verified, not production
            # Only enforce coverage on production AMD64 platforms
            if [[ "$os" == "macos-latest" ]]; then
              echo "📊 $label (ARM64) coverage: ${cov}% (informational, cross-compile verified)"
              continue
            fi

            echo "📊 $label coverage: ${cov}%"

            # Check threshold (use awk for float comparison)
            if awk -v cov="$cov" -v min="$MIN_COVERAGE" 'BEGIN {exit !(cov < min)}'; then
              echo "::error::Coverage for $label (${cov}%) is below ${MIN_COVERAGE}%"
              FAILED=1
            fi
          done

          echo ""
          if [ $FAILED -eq 1 ]; then
            echo "❌ Coverage check FAILED"
            exit 1
          fi

          echo "✅ All coverage thresholds met"
          echo "🎯 Production platforms (AMD64): 85%+ coverage"

  # ELF linking contract: default dynamic FFI vs -tags goffi_static
  # (gogpu#474 / goffi#74). Runs on Linux so file(1)/readelf are available.
  elf-linking:
    name: ELF Linking (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [lint, formatting]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build probe binaries
        run: |
          mkdir -p /tmp/goffi-elf
          cat > /tmp/goffi-elf/main.go <<'EOF'
          package main

          import (
          	"fmt"

          	"github.com/go-webgpu/goffi/ffi"
          )

          func main() {
          	_, err := ffi.LoadLibrary("libc.so.6")
          	fmt.Println(err)
          }
          EOF
          # Strip leading indentation from the heredoc body for valid Go.
          sed -i 's/^          //' /tmp/goffi-elf/main.go
          cd /tmp/goffi-elf
          go mod init goffielfprobe
          go mod edit -replace=github.com/go-webgpu/goffi="${{ github.workspace }}"
          go get github.com/go-webgpu/goffi@v0.0.0
          GOARCH=${{ matrix.arch }} go build -o default .
          GOARCH=${{ matrix.arch }} go build -tags goffi_static -o static .

      - name: Assert dynamic vs static ELF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils
          "${{ github.workspace }}/scripts/check-elf-linking.sh" --dynamic /tmp/goffi-elf/default
          "${{ github.workspace }}/scripts/check-elf-linking.sh" --static /tmp/goffi-elf/static

      - name: Static-profile unit tests
        if: matrix.arch == 'amd64'
        run: go test -tags goffi_static ./ffi -count=1 -run 'StaticBuild'

  # Final status - All checks passed
  ci-success:
    name: CI Success
    # android-cross is deliberately absent: Android is a preview platform
    # (see the note above the android-cross job).
    needs: [lint, lint-targets, formatting, cross-compile, test, test-go-stable, test-freebsd, benchmarks, quality-gate, elf-linking]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Success
        run: |
          echo "✅ All CI checks passed!"
          echo "✅ Lint: PASSED (linux/amd64 + every other target via lint-targets)"
          echo "✅ Formatting: PASSED"
          echo "✅ Cross-Compile: PASSED (8 desktop targets)"
          echo "✅ Tests: PASSED (CGO_ENABLED=0 and CGO_ENABLED=1)"
          echo "   - Linux AMD64 + ARM64, Windows AMD64 + ARM64, macOS ARM64 + AMD64"
          echo "   - Go 1.25 (go.mod minimum) and Go stable"
          echo "✅ FreeBSD: PASSED (tests in FreeBSD 14 and 15 VMs, amd64)"
          echo "✅ ELF Linking: PASSED (default dynamic + goffi_static)"
          echo "✅ Benchmarks: PASSED"
          echo "✅ Quality Gate: PASSED"
          echo ""
          echo "Note: Go tip runs as an informational job and does not gate this result"
          echo "Note: Android arm64 (preview) is checked by its own jobs and does not gate this result"
          echo "🚀 Ready for merge!"
