version: "2"

run:
  timeout: 10m
  concurrency: 4
  modules-download-mode: readonly
  # No build-tags: GOOS-named tags add files instead of switching the target
  # (with "linux", *_linux.go joined the host OS files and typecheck failed
  # off Linux). Lint other targets with GOOS/GOARCH, see the CI lint matrix.

linters:
  disable:
    - gocyclo
    - wsl
    - dupl
    - goconst
    - gocritic
    - gosec
    - funlen

  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign

  settings:
    govet:
      enable:
        - shadow

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: gen/.*\.pb\.go
        linters:
          - revive
          - govet
          - staticcheck
      - path: examples/.*
        linters:
          - revive
      - path: internal/arch/stubs
        linters:
          - govet
          - staticcheck
          - errcheck
          - ineffassign
      - path: internal/arch/amd64/.*\.s
        linters:
          - govet
      # fakecgo: Go runtime code with assembly callbacks
      - path: internal/fakecgo/
        linters:
          - unused        # Functions called from assembly
          - govet         # Low-level runtime code
          - staticcheck
          - ineffassign
      # dl: Dynamic library wrappers called from assembly
      - path: internal/dl/
        linters:
          - unused        # Wrappers called from assembly
          - staticcheck
      # FFI code: unsafe.Pointer is fundamental
      - path: ffi/dl_.*\.go
        linters:
          - govet         # unsafe.Pointer conversions are correct
      - path: internal/arch/amd64/implementation\.go
        linters:
          - govet         # unsafe.Pointer for return values
          - unused        # align() used for struct layout
      # ARM64 implementation: unsafe.Pointer for return values
      - path: internal/arch/arm64/implementation\.go
        linters:
          - govet         # unsafe.Pointer for return values
          - unused        # align() used for struct layout
      # Callback files: functions/variables called from assembly trampolines
      - path: ffi/callback(_arm64)?\.go
        linters:
          - unused        # callbackWrap_call referenced from assembly
      # Android: NewCallback always panics (callbacks are unsupported in the
      # preview, ffi/callback_android_arm64.go), so staticcheck treats the code
      # after it in the callback-struct tests as unreachable. Those tests skip
      # on arm64 before reaching it.
      - path: ffi/struct_e2e_test\.go
        text: "SA4006"
        linters:
          - staticcheck

issues:
  max-issues-per-linter: 100
  max-same-issues: 100